name: Production database backup
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      verify_restore:
        description: Validate restore in a disposable Neon branch
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-database-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: database-backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate && pnpm install --frozen-lockfile --ignore-scripts
      - name: Backup and optional isolated restore
        run: node scripts/database-backup.mjs
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_B2_ENDPOINT: ${{ secrets.BACKUP_B2_ENDPOINT }}
          BACKUP_B2_REGION: ${{ secrets.BACKUP_B2_REGION }}
          BACKUP_B2_BUCKET: ${{ secrets.BACKUP_B2_BUCKET }}
          BACKUP_B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          BACKUP_B2_APPLICATION_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BACKUP_VERIFY_RESTORE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_restore && 'true' || 'false' }}
